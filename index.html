<style>
/* ───── design tokens ───── */
:root {
  --bg: #0a0a0f;
  --bg-raised: #12121a;
  --bg-hover: rgba(255,255,255,0.04);
  --fg: #e0e0e0;
  --fg-bright: #fff;
  --dim: #888;
  --dim2: #555;
  --r0: #993366;  --r1: #00aadd;  --r2: #ffaa00;
  --r3: #ff4444;  --r4: #44aa44;  --r5: #aa44ff;  --r6: #eeeeee;
  --pass: #44aa44;
  --fail: #ff4444;
  --pending: #ffaa00;
  --mono: 'JetBrains Mono','Fira Code','Cascadia Code','Menlo',monospace;
  --serif: 'Georgia','Palatino',serif;
  --radius: 4px;
  --radius-lg: 6px;
  --border: rgba(255,255,255,0.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;
     line-height:1.55;padding:2rem 1.5rem;max-width:1100px;margin:0 auto}
a{color:inherit;text-decoration:none}
a:hover{color:var(--fg-bright)}
h1,h2,h3,h4{font-weight:400;letter-spacing:0.03em}
h1{font-size:1.8rem;margin-bottom:0.25rem}
h2{font-size:1rem;margin-top:3rem;margin-bottom:1rem;color:var(--dim);
   text-transform:uppercase;letter-spacing:0.1em;border-bottom:1px solid var(--border);padding-bottom:0.5rem}
h3{font-size:0.9rem;color:var(--dim);margin-bottom:0.5rem}
code,kbd{font-family:var(--mono);background:rgba(255,255,255,0.05);padding:1px 5px;border-radius:3px}
pre{font-family:var(--mono);white-space:pre-wrap;word-wrap:break-word}

/* ───── atoms ───── */
.eth-dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle}
.eth-dot.-large{width:12px;height:12px}
.eth-glyph{display:inline-block;font-size:1rem;line-height:1}
.eth-glyph.-large{font-size:1.4rem}
.eth-label{display:inline-block}
.eth-label.-dim{color:var(--dim)}
.eth-label.-bright{color:var(--fg-bright)}
.eth-label.-accent{color:var(--r2)}
.eth-label.-small{font-size:0.75rem}
.eth-label.-tiny{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase}
.eth-label.-serif{font-family:var(--serif)}
.eth-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:0.7rem;
           background:rgba(255,255,255,0.06);border:1px solid var(--border);
           letter-spacing:0.05em;line-height:1.5}
.eth-badge.-status{border-radius:10px;padding:1px 8px}
.eth-badge.-pass{color:var(--pass);border-color:rgba(68,170,68,0.3);background:rgba(68,170,68,0.08)}
.eth-badge.-fail{color:var(--fail);border-color:rgba(255,68,68,0.3);background:rgba(255,68,68,0.08)}
.eth-badge.-pending{color:var(--pending);border-color:rgba(255,170,0,0.3);background:rgba(255,170,0,0.08)}
.eth-badge.-link{cursor:pointer}
.eth-badge.-link:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.25)}
.eth-status-dot{display:inline-block;width:14px;height:14px;border-radius:50%;line-height:14px;
                text-align:center;font-size:0.7rem}
.eth-status-dot.-pass{background:rgba(68,170,68,0.15);color:var(--pass)}
.eth-status-dot.-fail{background:rgba(255,68,68,0.15);color:var(--fail)}
.eth-count{font-size:1.5rem;font-weight:600;line-height:1;color:var(--fg-bright)}
.eth-bar-segment{flex:1;height:4px;border-radius:2px}

/* ───── molecules ───── */
.eth-ring-bar{display:flex;gap:2px;margin:1.5rem 0 2rem 0}
.eth-layer-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;
                 background:var(--bg-raised);border-radius:var(--radius);font-size:0.75rem}
.eth-row{display:flex;align-items:center;gap:0.5rem;padding:0.4rem 0.6rem;
         border-radius:var(--radius);font-size:0.8rem;
         border-bottom:1px solid var(--border)}
.eth-row:last-child{border-bottom:none}
.eth-row:hover{background:var(--bg-hover)}
.eth-row .-statement{color:var(--fg);flex:1;font-family:var(--serif);font-size:0.85rem}
.eth-row .-meta{color:var(--dim);font-size:0.7rem;white-space:nowrap}
.eth-row-refs{display:inline-flex;gap:3px;flex-wrap:wrap}
.eth-store-card{padding:0.8rem 1rem;background:var(--bg-raised);border-radius:var(--radius);
                border-left:3px solid var(--dim2);display:flex;flex-direction:column;gap:0.2rem}

/* ───── organisms ───── */
.eth-sigil{font-size:1.4rem;letter-spacing:0.3em;color:var(--dim);margin-bottom:1rem}
.eth-subtitle{color:var(--dim);font-size:0.85rem;margin-bottom:0.5rem}
.eth-hero{margin-bottom:1rem}

.eth-paper-panel{background:var(--bg-raised);border-left:3px solid var(--dim);
                 padding:1rem 1.25rem;border-radius:0 var(--radius-lg) var(--radius-lg) 0;
                 cursor:pointer;transition:border-color 0.15s,background 0.15s;
                 scroll-margin-top:1rem;margin-bottom:1rem}
.eth-paper-panel:hover{background:rgba(255,255,255,0.04)}
.eth-paper-panel.-open{background:rgba(255,255,255,0.03)}
.eth-paper-panel .num{font-size:0.7rem;color:var(--dim);letter-spacing:0.12em;text-transform:uppercase}
.eth-paper-panel .title{font-size:1.05rem;font-weight:600;margin:0.2rem 0}
.eth-paper-panel .desc{font-family:var(--serif);font-size:0.85rem;color:var(--dim);line-height:1.55}
.eth-paper-panel .meta-row{display:flex;align-items:center;gap:1rem;margin-top:0.6rem;font-size:0.7rem;color:var(--dim);flex-wrap:wrap}
.eth-paper-panel .meta-row .dots{display:inline-flex;gap:3px}
.eth-paper-panel .meta-row .glyphs{letter-spacing:0.2em;font-size:0.9rem}
.eth-paper-panel .ratio{font-variant-numeric:tabular-nums}

.eth-paper-body{display:none;margin-top:1rem;padding-top:1rem;border-top:1px dashed var(--border)}
.eth-paper-panel.-open .eth-paper-body{display:block}
.eth-paper-body .data-blocks{display:flex;flex-direction:column;gap:1rem;margin-bottom:1rem}
.eth-paper-body .data-section{background:rgba(0,0,0,0.3);border-radius:var(--radius);padding:0.75rem 1rem}
.eth-paper-body .data-section-title{font-size:0.7rem;color:var(--dim);letter-spacing:0.1em;
                                      text-transform:uppercase;margin-bottom:0.5rem}
.eth-paper-body .prose{background:rgba(0,0,0,0.3);border-radius:var(--radius);
                        padding:1rem;font-size:0.82rem;line-height:1.7;max-height:60vh;
                        overflow-y:auto;white-space:pre-wrap;font-family:var(--mono);color:var(--fg)}

.eth-store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.75rem}
.eth-store-explorer{display:flex;flex-direction:column;gap:1rem;margin-top:1rem}
.eth-explorer-tabs{display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;
                   border-bottom:1px solid var(--border);padding-bottom:0.75rem}
.eth-explorer-tab{padding:0.4rem 0.8rem;background:var(--bg-raised);border-radius:var(--radius);
                  cursor:pointer;font-size:0.75rem;border:1px solid transparent;
                  display:flex;align-items:center;gap:0.4rem}
.eth-explorer-tab:hover{background:var(--bg-hover)}
.eth-explorer-tab.-active{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.05)}
.eth-explorer-tab .tab-count{color:var(--dim);font-size:0.65rem}
.eth-explorer-body{background:var(--bg-raised);border-radius:var(--radius);
                    padding:0.5rem 0.75rem;max-height:70vh;overflow-y:auto}

.eth-swarm-dashboard{background:var(--bg-raised);border-radius:var(--radius-lg);
                      padding:1rem;border:1px solid rgba(68,170,68,0.2)}
.eth-swarm-runners{display:flex;flex-direction:column;gap:0.3rem;margin-top:0.75rem;font-size:0.75rem}
.eth-swarm-runner{display:flex;align-items:center;gap:0.75rem;padding:0.3rem 0}
.eth-swarm-runner .runner-name{flex:1;color:var(--dim);font-size:0.72rem}

.eth-cross-ref-panel{margin-top:0.5rem;padding-top:0.5rem;border-top:1px dashed var(--border);
                      display:flex;flex-wrap:wrap;gap:4px}

.eth-footer{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--border);
            text-align:center;color:var(--dim);font-size:0.75rem}

/* ───── id highlight target ───── */
[id^="C0"],[id^="P0"],[id^="M0"],[id^="I0"],[id^="R0"],[id^="L0"],[id^="S0"]{scroll-margin-top:1rem}
.eth-highlight{animation:eth-pulse 1.2s ease-out 1}
@keyframes eth-pulse{
  0%,100%{background:transparent}
  30%{background:rgba(255,170,0,0.25)}
}

const el = (tag, props={}, children=[]) => {
 const n = document.createElement(tag);
 for (const [k,v] of Object.entries(props)) {

  else if (k === 'style') Object.assign(n.style, v);
  else if (k === 'onclick') n.onclick = v;
  else if (k === 'dataset') Object.assign(n.dataset, v);
  else if (k === 'html') n.innerHTML = v;
  else n.setAttribute(k, v);
 }
 (Array.isArray(children)?children:[children]).forEach(c => {
  if (c == null || c === false) return;
  n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
 });
 return n;
};

UDT['eth.org.paper-panel'] = {
 defaultProps: {paper:{}},
 render: p => {
  const m = p.paper;
  const cssColor = `var(--r${m.ring})`;
  const paperBlocks = PAPER_DATA[m.num] || {};
  const claimsRef = paperBlocks.claims_ref || [];

  // paper-specific data blocks (other than claims_ref)
  const extraBlocks = Object.keys(paperBlocks).filter(k => k !== 'claims_ref');
  const dataSections = extraBlocks.map(k => {
   const data = paperBlocks[k];
   return el('div', {class:'data-section'}, [
    el('div', {class:'data-section-title'}, k + ' · ' + (Array.isArray(data) ? data.length + ' items' : '1 object')),
    el('pre', {style:{fontSize:'0.72rem',color:'var(--dim)',whiteSpace:'pre-wrap'}},
      JSON.stringify(data, null, 2).slice(0, 2000) + (JSON.stringify(data).length > 2000 ? '\n…' : '')),
   ]);
  });

  const claimRows = claimsRef.map(cid => {
   const c = byId(STORE.claims, cid);
   return c ? UDT['eth.mol.row-claim'].render({claim:c}) : null;
  }).filter(Boolean);

  const panel = el('div', {
   class:'eth-paper-panel', id:`paper-${m.num}`,
   style:{borderLeftColor:cssColor},
   dataset:{paperNum:m.num},
  }, [
   el('div', {class:'num'}, 'Paper ' + m.num),
   el('div', {class:'title', style:{color:cssColor}}, m.title),
   el('div', {class:'desc'}, m.desc),
   el('div', {class:'meta-row'}, [
    el('span', {class:'glyphs'}, m.layers.map(l=>LAYER_GLYPHS[l]).join(' ')),
    el('span', {class:'dots'}, m.layers.map(l => UDT['eth.atom.ring-dot'].render({layer:l,size:8}))),
    el('span', {class:'ratio'}, m.per + ' : ' + m.cen + ' per:cen'),
    claimsRef.length ? el('span', {}, [
     UDT['eth.atom.label'].render({text:'cites:', variant:'tiny dim'}),
     ...claimsRef.map(cid => UDT['eth.atom.badge'].render({text:cid, variant:'', href:cid})),
    ]) : null,
   ]),
   el('div', {class:'eth-paper-body'}, [
    dataSections.length ? el('div', {class:'data-blocks'}, dataSections) : null,
    claimRows.length ? el('div', {class:'data-section'}, [
     el('div', {class:'data-section-title'}, 'Claims cited in this paper'),
     ...claimRows,
    ]) : null,
    el('div', {class:'data-section'}, [
     el('div', {class:'data-section-title'}, 'prose · from ' + m.file),
     el('pre', {class:'prose', dataset:{src:m.file,loaded:'false'}}, '(click the card again or wait · prose loads lazily from ' + m.file + ')'),
    ]),
   ]),
  ]);

  panel.addEventListener('click', async (ev) => {
   if (ev.target.closest('.eth-badge.-link')) return; // don't toggle when clicking badges
   panel.classList.toggle('-open');
   if (panel.classList.contains('-open')) {
    const pre = panel.querySelector('pre.prose');
    if (pre.dataset.loaded !== 'true') {
     try {
      const resp = await fetch(m.file);
      pre.textContent = resp.ok ? await resp.text() : '(404 · serve locally: python3 -m http.server)';
     } catch (e) {
      pre.textContent = '(fetch failed · python3 -m http.server, then reload)';
     }
     pre.dataset.loaded = 'true';
    }
   }
  });
  return panel;
 },
};

UDT['eth.org.paper-list'] = {
 defaultProps: {},

UDT['eth.org.store-grid'] = {
 defaultProps: {},
 render: () => {
  const summaries = [
   {key:'layers', count:STORE.layers.length, color:'--r0', label:'layers'},
   {key:'claims', count:STORE.claims.length, color:'--r3', label:'claims'},
   {key:'predictions', count:STORE.predictions.length, color:'--r4', label:'predictions'},
   {key:'metrics', count:STORE.metrics.length, color:'--r2', label:'metrics'},
   {key:'interventions', count:STORE.interventions.length, color:'--r1', label:'interventions'},
   {key:'references', count:STORE.references.length, color:'--r5', label:'references'},
  ];
  return el('div', {class:'eth-store-grid'},
   summaries.map(s => el('div', {
    class:'eth-store-card',
    style:{borderLeftColor:`var(${s.color})`, cursor:'pointer'},
    onclick: () => {
     window.__setExplorerTab && window.__setExplorerTab(s.key);
     document.getElementById('eth-explorer')?.scrollIntoView({behavior:'smooth'});
    },
   }, [
    UDT['eth.atom.count'].render({value:s.count}),
    UDT['eth.atom.label'].render({text:s.label, variant:'small dim'}),
   ])));
 },
};

UDT['eth.org.store-explorer'] = {
 defaultProps: {},
 render: () => {
  const tabs = [
   {key:'layers',       storeKey:'layers',       molType:'eth.mol.row-layer',        propKey:'layer'},
   {key:'claims',       storeKey:'claims',       molType:'eth.mol.row-claim',        propKey:'claim'},
   {key:'predictions',  storeKey:'predictions',  molType:'eth.mol.row-prediction',   propKey:'prediction'},
   {key:'metrics',      storeKey:'metrics',      molType:'eth.mol.row-metric',       propKey:'metric'},
   {key:'interventions',storeKey:'interventions',molType:'eth.mol.row-intervention', propKey:'intervention'},
   {key:'references',   storeKey:'references',   molType:'eth.mol.row-reference',    propKey:'reference'},
  ];
  const tabBar = el('div', {class:'eth-explorer-tabs'});
  const body = el('div', {class:'eth-explorer-body'});
  const setTab = (key) => {
   tabBar.querySelectorAll('.eth-explorer-tab').forEach(t=>t.classList.toggle('-active', t.dataset.key===key));
   const tab = tabs.find(t=>t.key===key);
   body.innerHTML = '';
   STORE[tab.storeKey].forEach(item => {
    const row = UDT[tab.molType].render({[tab.propKey]:item});
    body.appendChild(row);
   });
  };
  tabs.forEach(t => {
   const btn = el('div', {
    class:'eth-explorer-tab',
    dataset:{key:t.key},
    onclick: () => setTab(t.key),
   }, [
    UDT['eth.atom.label'].render({text:t.key, variant:''}),
    el('span', {class:'tab-count'}, '· ' + STORE[t.storeKey].length),
   ]);
   tabBar.appendChild(btn);
  });
  window.__setExplorerTab = setTab;
  setTimeout(()=>setTab('claims'), 0);
  return el('section', {id:'eth-explorer', class:'eth-store-explorer'}, [tabBar, body]);
 },
};

<script>
/* ─────────────────────────────────────────────────────────────
   VIEW_DEF · Perspective-style component tree (JSON)
   The renderer walks this and instantiates each UDT.
   ───────────────────────────────────────────────────────────── */
const VIEW_DEF = {
 type: "eth.org.page",
 props: {},
 children: [],
};

/* renderer · looks up type in UDT, merges props over defaults,
   calls .render(), then recurses into children (appended to a
   [data-slot=children] element if present, else to the root). */
function renderView(viewDef, parentEl) {
 const udt = UDT[viewDef.type];
 if (!udt) {
  parentEl.appendChild(el('div', {style:{color:'red'}}, `unknown UDT: ${viewDef.type}`));
  return;
 }
 const mergedProps = Object.assign({}, udt.defaultProps, viewDef.props || {});
 const node = udt.render(mergedProps);
 if (viewDef.children && viewDef.children.length) {
  const slot = node.querySelector('[data-slot="children"]') || node;
  viewDef.children.forEach(child => renderView(child, slot));
 }
 parentEl.appendChild(node);
}

/* bootstrap */
document.addEventListener('DOMContentLoaded', () => {
 const app = document.getElementById('app');
 renderView(VIEW_DEF, app);

 // anchor-hash navigation: if URL has #C001 etc, scroll on load
 if (location.hash) {
  setTimeout(() => navigateTo(location.hash.slice(1)), 100);
 }
});

/* Expose registry for debugging and for exporting to an actual
   Ignition Perspective view definition. */
window.ETH = {UDT, VIEW_DEF, STORE, PAPER_DATA, PAPERS_META, SWARM_DATA, navigateTo};
</script>
