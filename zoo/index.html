   {n:'head',p:[0,12,0],k:[{g:'sph',d:[10]},{g:'con',d:[3,10,3],c:0x664499,p:[0,8,4]},{g:'con',d:[3,10,3],c:0x664499,p:[0,8,-4]},eye([6,2,5],0xff4400),eye([6,2,-5],0xff4400),{g:'sph',d:[2],c:0xffffff,p:[8,-2,3]},{g:'sph',d:[2],c:0xffffff,p:[8,-2,-3]}]},
   {n:'wL',p:[0,3,5],k:[{g:'box',d:[2,25,3],c:0x552288,p:[15,0,0],r:[0,0,.5]},{g:'box',d:[2,20,3],c:0x552288,p:[32,-8,0],r:[0,0,.3]}]},
   {n:'wR',p:[0,3,-5],k:[{g:'box',d:[2,25,3],c:0x552288,p:[-15,0,0],r:[0,0,-.5]},{g:'box',d:[2,20,3],c:0x552288,p:[-32,-8,0],r:[0,0,-.3]}]},
   {n:'feet',p:[0,-12,0],k:[{g:'cyl',d:[1,1,8],c:0x552288,p:[4,-4,0]},{g:'cyl',d:[1,1,8],c:0x552288,p:[-4,-4,0]}]}]}]},
  beh:[{t:'wL',f:'flap',s:15,a:.7},{t:'wR',f:'flap',s:15,a:-.7},{t:'body',f:'bob',s:3,a:8},{t:'head',f:'sway',s:4,a:.3}]}
];

const scene=new T.Scene();
const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,1,10000);
camera.position.set(0,150,900);camera.lookAt(0,0,0);
const gl=new T.WebGLRenderer({antialias:true,alpha:true});
gl.setSize(innerWidth,innerHeight);gl.setClearColor(0x0a0804,1);
document.body.appendChild(gl.domElement);
const css=new T.CSS3DRenderer();css.setSize(innerWidth,innerHeight);
css.domElement.style.cssText='position:fixed;inset:0;pointer-events:none';
document.body.appendChild(css.domElement);
scene.add(new T.GridHelper(1800,36,0xDCA030,0x3a2810).translateY(-100));

const LABELS=[];let labelsVisible=true;
function toggleLabels(){labelsVisible=!labelsVisible;LABELS.forEach(l=>l.visible=labelsVisible)}

const CREATURES=[],PICKABLE=[];
ZOO.forEach(cd=>{const root=new T.Group();root.position.set(...cd.at);scene.add(root);
 const reg={};build(cd.parts,root,reg,cd.pal);
 root.traverse(o=>{if(o.isMesh){o.userData.creature=cd.n;PICKABLE.push(o)}});
 const cnv=document.createElement('canvas');cnv.width=256;cnv.height=64;
 const ctx=cnv.getContext('2d');
 ctx.fillStyle='#0a0804ee';ctx.fillRect(0,0,256,64);
 ctx.strokeStyle='#'+cd.pal.toString(16).padStart(6,'0');ctx.lineWidth=2;ctx.strokeRect(1,1,254,62);
 ctx.font='bold 20px "Courier New"';ctx.fillStyle='#'+cd.pal.toString(16).padStart(6,'0');ctx.textAlign='center';
 ctx.fillText(cd.jp+' · '+cd.ring,128,26);
 ctx.font='14px "Courier New"';ctx.fillStyle='#DCA030';
 ctx.fillText(cd.role,128,48);
 const tex=new T.CanvasTexture(cnv);
 const sprite=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true}));
 sprite.scale.set(80,20,1);sprite.position.set(0,80,0);
 root.add(sprite);LABELS.push(sprite);
 const kEntry={k:KSTAR+(Math.random()-.5)*.5,name:cd.n};K.list.push(kEntry);
 CREATURES.push({cd,root,reg,kEntry})});
document.getElementById('s').textContent=CREATURES.length+' 生き物 · κ-coupled';

const HYD=new Map();
function hydrate(cd,target){if(HYD.has(cd.n))return;
 const col='#'+cd.pal.toString(16).padStart(6,'0');
 const r=document.createElement('div');r.className='t';
 r.style.cssText+=`;border-color:${col};color:${col};box-shadow:0 0 18px ${col}44 inset`;
 r.innerHTML=`<span class="x">✕</span>
  <h4 style="border-color:${col}">${cd.jp} · ${cd.n} · κ=<span class="kv">—</span></h4>
  <div class="meta">${cd.role} · ${cd.ring}</div>
  <div class="o"></div>
  <input placeholder="呟き · pet feed kick stats κ=...">`;
 const o=r.querySelector('.o'),i=r.querySelector('input'),kv=r.querySelector('.kv');
 const log=m=>{const d=document.createElement('div');d.textContent=m;d.style.borderColor=col;o.appendChild(d);o.scrollTop=o.scrollHeight};
 log("» "+cd.msg);
 const entry=CREATURES.find(x=>x.cd===cd).kEntry;
 const replies={Gerald:"*reads · no reply*",Cassandra:"*seals envelope*",Gary:"measuring...",Kono:"*stands in ground*",Konomi:"*soft nicker* 🎵",Kelly:"*wave: rolling*",Jake:"won't apologize",Alex:"*scans cliff*",Teresa:"RRAAH- *gate slams*",Thomas:"...",John:"*low infrasonic rumble*",Buzz:"bzzzzz · 510510",Charlotte:"sh sh sh",Laurie:"楽 metric ↑"};
 i.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
  const c=i.value.trim().toLowerCase();i.value='';if(!c)return;log("› "+c);
  if(c==='pet'||c==='good'){entry.k=Math.min(.95,entry.k+.1);log("♥ κ+")}
  else if(c==='feed'){entry.k=KSTAR;log("→ φ locked · "+KSTAR.toFixed(3))}
  else if(c==='kick'){entry.k=Math.random();log("⚡ scrambled")}
  else if(c==='stats')log(`κ=${entry.k.toFixed(3)} Ω=${K.mean.toFixed(3)} δ=${Math.abs(entry.k-KSTAR).toFixed(3)}`);
  else if(c.startsWith('κ=')||c.startsWith('k=')){const v=parseFloat(c.slice(2));if(!isNaN(v)){entry.k=Math.max(.05,Math.min(.95,v));log("κ set "+v.toFixed(3))}}
  else log(replies[cd.n]||"*"+cd.n.toLowerCase()+" stares*")});
 r.querySelector('.x').onclick=()=>{scene.remove(HYD.get(cd.n));HYD.delete(cd.n)};
 r.addEventListener('pointerdown',e=>e.stopPropagation());r.style.pointerEvents='auto';
 const obj=new T.CSS3DObject(r);obj.scale.setScalar(.5);obj.userData.tgt=target;obj.userData.kv=kv;obj.userData.entry=entry;
 scene.add(obj);HYD.set(cd.n,obj)}

const ray=new T.Raycaster(),mouse=new T.Vector2();
let drag=false,moved=false,px=0,py=0,rx=.1,ry=.3;
addEventListener('pointerdown',e=>{drag=true;moved=false;px=e.clientX;py=e.clientY});
addEventListener('pointermove',e=>{if(drag){if(Math.abs(e.clientX-px)+Math.abs(e.clientY-py)>4)moved=true;ry+=(e.clientX-px)*.006;rx+=(e.clientY-py)*.006;px=e.clientX;py=e.clientY}mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1});
addEventListener('pointerup',()=>{if(drag&&!moved){ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(PICKABLE,true)[0];if(h){let m=h.object;while(m&&!m.userData?.creature)m=m.parent;if(m){const cd=ZOO.find(z=>z.n===m.userData.creature);hydrate(cd,CREATURES.find(x=>x.cd===cd).root)}}}drag=false});
addEventListener('wheel',e=>{camera.position.z=Math.max(200,Math.min(2500,camera.position.z+e.deltaY))},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();gl.setSize(innerWidth,innerHeight);css.setSize(innerWidth,innerHeight)});

const tmp=new T.Vector3();let lastT=0;
function tick(ts){const t=ts*.001,dt=Math.min(.05,t-lastT);lastT=t;
 if(K.run)K.step(dt);
 document.getElementById('k').textContent=K.mean.toFixed(4);
 CREATURES.forEach(({cd,reg,kEntry})=>{const kMul=.3+kEntry.k*1.4;cd.beh.forEach(b=>{const n=reg[b.t];if(n&&DRV[b.f])DRV[b.f](n,t,b,kMul)})});
 scene.rotation.x+=(rx-scene.rotation.x)*.08;
 scene.rotation.y+=(ry-scene.rotation.y)*.08;
 HYD.forEach(obj=>{obj.userData.tgt.getWorldPosition(tmp);obj.position.copy(tmp).add(new T.Vector3(0,110,0));obj.quaternion.copy(camera.quaternion);if(obj.userData.kv)obj.userData.kv.textContent=obj.userData.entry.k.toFixed(3)});
 gl.render(scene,camera);css.render(scene,camera);requestAnimationFrame(tick)}
tick(0);
</script></body></html>
